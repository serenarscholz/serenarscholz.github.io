- title: About Me
  description: >
    Welcome! I'm a PhD candidate at Yale University, working with Prof. Juan Lora 
    in the [Planetary Atmospheres group](https://earth.yale.edu/profile/juan-m-lora).
    I study atmospheric rivers: long, narrow storm systems that transport large amounts 
    of water and energy across the globe, and can cause spectacular amounts of rain 
    when they make landfall. I'm also interested in large-scale atmospheric dynamics 
    and circulation, Earth's past and future hydroclimate, and the global water and 
    energy cycles.
  type: misc_list

